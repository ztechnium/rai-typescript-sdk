name: Publish

on:
  push:
    tags:
      - "v*"

# Publishes via npm Trusted Publishing (OIDC). Requires:
# 1. Package already exists on npm (first version published locally once), AND
# 2. Trusted Publisher configured on npmjs.com for this repo + publish.yml
# Do not set NODE_AUTH_TOKEN — a 2FA-gated token causes EOTP in CI.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack dry-run
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --provenance
